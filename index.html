<title>운동 통증 점검</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column like a phone screen; a 5-segment progress bar styled after colour-coded bumper plates sits on top. */
:root {
  --chalk: #F2F3F0;      /* page: gym chalk */
  --card: #FFFFFF;
  --ink: #15191E;
  --muted: #59626B;
  --line: #D7DBD5;
  --plate: #1D55C4;      /* 20 kg plate blue: the accent */
  --plate-ink: #FFFFFF;
  --plate-tint: #E5ECFA;
  --danger: #C2302A;     /* 25 kg red: red flags */
  --danger-tint: #FBE8E6;
  --warn: #9A6A00;       /* 15 kg yellow: weak evidence */
  --warn-tint: #FBF1D6;
  --good: #2A7743;       /* 10 kg green: strong evidence */
  --good-tint: #E3F2E7;
  --font-display: "Black Han Sans", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --chalk: #111417; --card: #191D22; --ink: #E9EBE7; --muted: #9AA3AB; --line: #2B3138;
    --plate: #6E9BFF; --plate-ink: #0A1124; --plate-tint: #1A2645;
    --danger: #FF7B70; --danger-tint: #3A1B19; --warn: #F0C04C; --warn-tint: #3A3018;
    --good: #6CCB8A; --good-tint: #18301F; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --chalk: #111417; --card: #191D22; --ink: #E9EBE7; --muted: #9AA3AB; --line: #2B3138;
  --plate: #6E9BFF; --plate-ink: #0A1124; --plate-tint: #1A2645;
  --danger: #FF7B70; --danger-tint: #3A1B19; --warn: #F0C04C; --warn-tint: #3A3018;
  --good: #6CCB8A; --good-tint: #18301F; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--chalk); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
  word-break: keep-all; overflow-wrap: anywhere;
}
.app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

/* top bar */
.top { display: flex; flex-direction: column; gap: 10px; }
.brand { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.brand b { font-family: var(--font-display); font-weight: 400; font-size: 20px; letter-spacing: 0.01em; }
.brand span { font-family: var(--font-mono); font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
.level { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.level span { margin-right: 2px; }
.level button { appearance: none; background: var(--card); color: inherit; border: 1.5px solid var(--line); border-radius: 999px; padding: 5px 12px; min-height: 32px; font-size: 13px; cursor: pointer; }
.level button[aria-pressed="true"] { border-color: var(--plate); color: var(--plate); font-weight: 600; }
.level button:focus-visible { outline: 3px solid var(--plate); outline-offset: 2px; }
.levelpick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.levelpick .opt { flex-direction: column; align-items: flex-start; gap: 4px; }
.levelpick .opt small { color: var(--muted); font-size: 13px; }
.stages { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.stage { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stage i { display: block; height: 6px; border-radius: 3px; background: var(--line); }
.stage.done i { background: var(--ink); }
.stage.now i { background: var(--plate); }
.stage small { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stage.now small { color: var(--ink); font-weight: 600; }

/* type */
h1, h2 { margin: 0; text-wrap: balance; line-height: 1.3; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(28px, 7vw, 36px); }
h2 { font-family: var(--font-body); font-weight: 600; font-size: 22px; letter-spacing: -0.01em; }
h3 { font-size: 17px; margin: 0; font-weight: 700; }
p { margin: 0; }
.lead { color: var(--muted); }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.06em; color: var(--muted); text-transform: uppercase; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-lg { display: flex; flex-direction: column; gap: 20px; }

/* surfaces */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.note { font-size: 14px; color: var(--muted); border-left: 3px solid var(--line); padding: 2px 0 2px 12px; }
.alert { border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 10px; background: var(--danger-tint); border: 1px solid var(--danger); }
.alert h2 { color: var(--danger); }
.notice { border-radius: 14px; padding: 16px 18px; background: var(--plate-tint); display: flex; flex-direction: column; gap: 6px; }

/* steps on start screen */
.flow { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0; }
.flow li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.flow li:first-child { border-top: 0; }
.flow em { font-style: normal; font-family: var(--font-mono); font-size: 13px; color: var(--plate); padding-top: 2px; }
.flow span { font-size: 15px; }

/* controls */
button { font: inherit; color: inherit; }
.btn { appearance: none; border: 0; border-radius: 12px; padding: 14px 18px; font-weight: 700; font-size: 16px; cursor: pointer; background: var(--plate); color: var(--plate-ink); min-height: 52px; }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.small { min-height: 40px; padding: 8px 12px; font-size: 14px; font-weight: 600; }
.btn:focus-visible, .opt:focus-visible, .seg button:focus-visible, a:focus-visible, .check input:focus-visible { outline: 3px solid var(--plate); outline-offset: 2px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row .btn { flex: 1 1 140px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--plate); text-decoration: underline; cursor: pointer; font-size: 14px; }
a { color: var(--plate); }

.check { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; cursor: pointer; }
.check input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--plate); flex: none; }

.opts { display: flex; flex-direction: column; gap: 8px; }
.parts { display: flex; flex-wrap: wrap; gap: 8px; }
.parts.body { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.part { appearance: none; background: var(--card); color: inherit; border: 1.5px solid var(--line); border-radius: 999px; padding: 9px 16px; min-height: 44px; font-size: 15px; cursor: pointer; }
.part[aria-pressed="true"] { border-color: var(--plate); background: var(--plate); color: var(--card); font-weight: 600; }
.part:focus-visible { outline: 3px solid var(--plate); outline-offset: 2px; }
.subq { font-size: 15px; color: var(--muted, inherit); margin: 4px 0 0; }
.opt { appearance: none; text-align: left; width: 100%; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 14px 16px; cursor: pointer; display: flex; gap: 12px; align-items: center; min-height: 54px; font-size: 16px; }
.opt .mark { width: 20px; height: 20px; flex: none; border: 2px solid var(--line); border-radius: 50%; display: grid; place-items: center; }
.opt.multi .mark { border-radius: 5px; }
.opt[aria-pressed="true"] { border-color: var(--plate); background: var(--plate-tint); }
.opt.pic { flex-direction: column; align-items: stretch; padding: 8px; gap: 8px; }
.opt.pic img { display: block; width: 100%; height: auto; border-radius: 8px; }
.opt.pic .pic-label { display: flex; gap: 12px; align-items: center; padding: 2px 8px 4px; }
.opt[aria-pressed="true"] .mark { border-color: var(--plate); background: var(--plate); }
.opt[aria-pressed="true"] .mark::after { content: ""; width: 8px; height: 8px; background: var(--plate-ink); border-radius: 2px; }

/* red-flag rows */
.flag { display: flex; flex-direction: column; gap: 10px; padding: 14px 0; border-top: 1px solid var(--line); }
.flag:first-child { border-top: 0; padding-top: 0; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.seg button { appearance: none; border: 1.5px solid var(--line); background: var(--card); border-radius: 10px; min-height: 44px; cursor: pointer; font-weight: 600; }
.seg button[aria-pressed="true"].yes { border-color: var(--danger); background: var(--danger-tint); color: var(--danger); }
.seg button[aria-pressed="true"].no { border-color: var(--ink); background: var(--ink); color: var(--chalk); }

/* barbell figure */
.bar-fig { width: 100%; height: auto; display: block; }
.bar-fig text { font-family: var(--font-mono); font-size: 11px; fill: var(--muted); }

/* evidence chips */
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.strong { color: var(--good); background: var(--good-tint); }
.chip.mid { color: var(--plate); background: var(--plate-tint); }
.chip.weak { color: var(--warn); background: var(--warn-tint); }
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.src { font-size: 13px; color: var(--muted); }

.adj { display: flex; flex-direction: column; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); }
.adj:first-of-type { border-top: 0; padding-top: 0; }
.adj .how { font-size: 15px; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: 0.02em; padding: 2px 7px; border-radius: 5px; border: 1px solid currentColor; white-space: nowrap; line-height: 1.5; }
.tag.fact { color: var(--ink); }
.tag.synth { color: var(--plate); }
.tag.app { color: var(--good); }
.tag.hypo { color: var(--warn); border-style: dashed; background: var(--warn-tint); }
.rv { display: inline-flex; align-items: center; gap: 4px; align-self: flex-start; width: fit-content; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; color: var(--good); border: 1px solid var(--good); line-height: 1.5; }
.rv::before { content: "✓"; }
.basis, .kinds li { display: grid; grid-template-columns: 104px minmax(0, 1fr); column-gap: 12px; align-items: start; }
.basis .tag, .kinds .tag { width: 100%; box-sizing: border-box; text-align: center; margin-top: 3px; }
.basis p, .kinds li > span:not(.tag) { margin: 0; font-size: 15px; line-height: 1.6; }
.kinds { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.log { display: flex; flex-direction: column; gap: 6px; }
.log .seg { grid-template-columns: repeat(3, 1fr); }
.log .seg button { font-size: 14px; }
.log .seg button[aria-pressed="true"][data-v="less"] { border-color: var(--good); background: var(--good-tint); color: var(--good); }
.log .seg button[aria-pressed="true"][data-v="same"] { border-color: var(--ink); background: var(--ink); color: var(--chalk); }
.log .seg button[aria-pressed="true"][data-v="more"] { border-color: var(--danger); background: var(--danger-tint); color: var(--danger); }
.logmsg { font-size: 14px; color: var(--muted); }

.qcount { font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 10px 8px; border-top: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; border-top: 0; }
tr.hit td { background: var(--plate-tint); }
tr.hit td:first-child { box-shadow: inset 3px 0 0 var(--plate); }

.summary { font-family: var(--font-body); font-size: 14px; white-space: pre-wrap; background: var(--chalk); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin: 0; }
.sources { margin: 0; padding-left: 18px; font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
footer { font-size: 12px; color: var(--muted); text-align: center; padding-top: 8px; }

@media (prefers-reduced-motion: no-preference) {
  .screen { animation: rise 0.25s ease-out; }
  @keyframes rise { from { transform: translateY(6px); opacity: 0.6; } to { transform: none; opacity: 1; } }
}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><b id="brandName">운동 통증 점검</b><span id="brandTag">PAIN CHECK</span></div>
    <div class="level" role="group" aria-label="설명 방식">
      <span>설명</span>
      <button data-act="level" data-v="easy" aria-pressed="true">쉬운 말</button>
      <button data-act="level" data-v="pro" aria-pressed="false">의학 용어</button>
    </div>
    <div class="stages" id="stages" aria-label="진행 단계"></div>
  </header>
  <main id="main" aria-live="polite"></main>
  <footer>이 앱은 의료기기가 아니며 질병 여부를 판단하지 않습니다. 통증이 계속되거나 심해지면 정형외과나 재활의학과 진료를 받으세요.</footer>
</div>

<script>
/* =========================================================
   CONTENT — 문구와 질문은 여기만 고치면 됩니다.
   ========================================================= */
const STAGES = ["위험 신호", "증상 질문", "패턴", "조정", "전문가"];

const BASE_FLAGS = [
  { id: "cardiac", q: "가슴이 답답하거나 숨이 차고, 식은땀과 함께 어깨나 팔이 아픈가요?", level: 0 },
  { id: "disloc", q: "어깨가 빠진 느낌이 들거나 모양이 변했나요?", level: 1 },
  { id: "infect", q: "열이 나거나, 어깨가 붉고 뜨겁게 부었나요?", level: 1 },
  { id: "night", q: "쉬어도 밤새 계속 아프거나, 혹이 만져지거나, 이유 없이 살이 빠졌나요?", level: 3 },
  { id: "neck", q: "팔이나 손이 저리거나, 통증이 팔꿈치 아래까지 내려가나요?", level: 3 },
];
const BASE_LEVELS = [
  { title: "지금 119에 전화하세요", body: "어깨가 아니라 심장이나 폐 문제일 수 있어요. 운동을 멈추고 바로 도움을 요청하세요.", call: true },
  { title: "오늘 응급실로 가세요", body: "탈구나 관절 감염은 당일 치료가 필요해요. 운동 조언으로 해결할 수 있는 상황이 아니에요." },
  null,
  { title: "빠른 시일 내 진료를 받으세요", body: "어깨 근육·힘줄 문제가 아닐 수 있어요. 목에서 오는 통증이나 다른 원인을 먼저 확인해야 해요." },
];
const withFlag = (extra) => [BASE_FLAGS[0], BASE_FLAGS[1], BASE_FLAGS[2], extra, BASE_FLAGS[3], BASE_FLAGS[4]];
const withLevel = (lv2) => BASE_LEVELS.map((l, i) => i === 2 ? lv2 : l);

const COMMON_Q = {
  dur: { id: "dur", q: "아픈 지 얼마나 됐나요?", opts: [["lt2", "2주 미만"], ["w2to6", "2~6주"], ["gt6", "6주 이상"]] },
  trend: { id: "trend", q: "요즘 통증은 어떻게 변하고 있나요?", opts: [["better", "좋아지는 중"], ["same", "그대로"], ["worse", "나빠지는 중"]] },
  acc: { id: "acc", q: "밴드 외회전이나 날개뼈 운동 같은 보조운동을 하나요?", opts: [["regular", "정기적으로 함"], ["sometimes", "가끔"], ["never", "안 함"]] },
};
const COMMON_P = {
  rc: (where) => ({ name: "회전근개 관련 통증", plain: `어깨 속 힘줄이 눌리거나 과부하를 받는 패턴이에요. ${where}`,
        say: "운동으로 좋아지는 경우가 많아요. 아래 조정부터 해 보세요.",
        ev: "mid", evText: "진단명 자체는 모호하지만, 운동치료가 1차 치료라는 근거는 강해요.", src: "Pieters 2020, Kibler 2013" }),
};
const COMMON_A = {
  acc: { title: "회전근개·날개뼈 운동 추가", how: "밴드 외회전, 엎드려 Y자로 팔 들기처럼 아래쪽 등과 날개뼈 근육을 쓰는 운동을 가볍게 시작하세요. 어깨를 귀 쪽으로 으쓱하지 않도록 하세요.",
         fact: "운동치료는 어깨 충돌성 통증의 1차 치료로 권고돼요. 날개뼈 중심 운동이 단기에 일반 운동보다 나았어요.", hypo: "여기 적은 두 운동은 앱이 고른 예시예요. 어떤 운동을 몇 번 하는 게 가장 좋은지는 정해져 있지 않아요.", ev: "strong", src: "Pieters 2020, Kibler 2013" },
};
const SRC = {
  bess: ["BESS/BOA 어깨 통증 진료 경로 (Rees 2021)", "https://pmc.ncbi.nlm.nih.gov/articles/PMC7905504"],
  pieters: ["Pieters 2020, 어깨 충돌성 통증 보존치료 종합 고찰", "https://repository.uantwerpen.be/docman/irua/187b87/163966_2020_05_18.pdf"],
  kibler: ["Kibler 2013, 견갑 운동이상 국제 합의문", "https://bjsm.bmj.com/content/47/14/877"],
  hickey: ["Hickey 2018, 견갑 운동이상과 어깨 통증 위험", "https://bjsm.bmj.com/content/52/2/102"],
  barrett: ["Barrett 2016, 등 자세와 어깨 통증·가동범위", "https://www.pubmed.gov/27475532/"],
};

const TOPICS = {
  /* ---------------- 벤치프레스 ---------------- */
  bench: {
    name: "벤치프레스", brand: "벤치 어깨 점검", eyebrow: "BENCH · SHOULDER",
    hero: "벤치할 때 어깨가 아프다면",
    redFlags: withFlag({ id: "tear", q: "무거운 무게를 내리다 \"뚝\" 하는 느낌과 함께 아프고 힘이 빠졌나요? 가슴이나 겨드랑이 모양이 그대로여도 해당돼요.", level: 2 }),
    flagLevels: withLevel({ title: "며칠 안에 정형외과 진료를 받으세요", body: "대흉근이나 회전근개가 찢어졌을 수 있어요. 대흉근 부분 파열은 겉모양이 정상처럼 보이기도 해요. 일찍 볼수록 치료 선택지가 많아요." }),
    flagSrc: "BESS/BOA 어깨 통증 진료 경로 (Rees 2021), ElMaraghy 2012",
    questions: [
      { id: "where", q: "어디가 아픈가요?", opts: [
        ["front", "어깨 앞쪽"], ["top", "어깨 위쪽 한 점 (쇄골 끝)"], ["sideback", "어깨 옆이나 뒤"], ["unsure", "잘 모르겠음"] ] },

    summary(a) { return [
      `아픈 곳: ${label("where", a.where)}`,
      `아플 때: ${label("when", a.when)}`,
      `기간·경과: ${label("dur", a.dur)}, ${label("trend", a.trend)}`,

      `벤치 1RM: 체중의 ${label("load", a.load)}`,
      `다른 아픈 운동: ${(a.other || []).map(v => label("other", v)).join(", ") || "-"}`,
      `불편한 일상 동작: ${(a.daily || []).map(v => label("daily", v)).join(", ") || "-"}`]; },
    analyse(a) {
      const sc = { rc: 0, acj: 0, scap: 0, ag: 0 };
      if (has(a, "where", "front") || has(a, "where", "sideback")) sc.rc += 2;
      ["lateral", "upright", "ohp"].forEach(v => { if (has(a, "other", v)) sc.rc += 1; });
      if (has(a, "daily", "overhead")) sc.rc += 2;
      if (has(a, "when", "lower") || has(a, "when", "press")) sc.rc += 1;
      if (has(a, "where", "top")) sc.acj += 4;
      if (has(a, "daily", "cross")) sc.acj += 1;
      if (has(a, "grip", "g2")) sc.acj += 2; else if (has(a, "grip", "g15")) sc.acj += 1;
      if (has(a, "load", "gt15")) sc.acj += 2;
      if (has(a, "scap", "no") || has(a, "scap", "unsure")) sc.scap += 2;
      if (has(a, "acc", "never")) sc.scap += 1;
      if (has(a, "where", "front")) sc.ag += 1;
      if (has(a, "when", "lower")) sc.ag += 1;
      if (has(a, "daily", "cross")) sc.ag += 1;
      if (has(a, "daily", "behind")) sc.ag += 1;

      const main = sc.acj > sc.rc ? "acj" : "rc";
      const other = main === "rc" ? "acj" : "rc";
      const patterns = [main];
      if (sc[other] >= 3) patterns.push(other);
      if (sc.scap >= 2) patterns.push("scap");

      const picks = [];
      picks.push(["load", main === "acj" || has(a, "load", "gt15") ? 1 : 6]);
      if (has(a, "grip", "g15") || has(a, "grip", "g2")) picks.push(["grip", 2]);
      if (has(a, "scap", "no") || has(a, "scap", "unsure")) picks.push(["scap", 3]);
      if (has(a, "elbow", "flared") || has(a, "elbow", "tucked")) picks.push(["elbow", 5]);
      if (has(a, "acc", "never") || has(a, "acc", "sometimes")) picks.push(["acc", 4]);
      if (has(a, "daily", "cross") || has(a, "daily", "behind")) picks.push(["flex", 7]);
      return finish(a, sc, patterns, picks, has(a, "when", "daily"));
    },

      return out;
    },
  },

    summary(a) { return [
      `아픈 곳: ${label("where", a.where)}`,
      `팔을 옆으로 들 때: ${label("arc", a.arc)}`,
      `기간·경과: ${label("dur", a.dur)}, ${label("trend", a.trend)}`,
      `프레스 방식: ${label("style", a.style)} / 그립: ${label("ogrip", a.ogrip)}`,
      `아픈 쪽으로 누우면 아픔: ${label("side", a.side)} / 허리 젖혀짐: ${label("arch", a.arch)} / 어깨 솟음: ${label("shrug", a.shrug)}`,
      `벽 팔 올리기: ${label("wall", a.wall)}`]; },
    analyse(a) {
      const sc = { rc: 0, acj: 0, btn: 0, trunk: 0 };
      if (has(a, "where", "frontside")) sc.rc += 2;
      if (has(a, "arc", "mid")) sc.rc += 3; else if (has(a, "arc", "all")) sc.rc += 1;
      if (has(a, "side", "yes")) sc.rc += 2;
      if (has(a, "where", "top")) sc.acj += 4;
      if (has(a, "arc", "top")) sc.acj += 2;
      if (has(a, "style", "behind")) sc.btn += 3;
      if (has(a, "where", "neck")) sc.btn += 2;
      if (has(a, "arch", "yes")) sc.trunk += 2; else if (has(a, "arch", "unsure")) sc.trunk += 1;
      if (has(a, "wall", "no")) sc.trunk += 2; else if (has(a, "wall", "barely")) sc.trunk += 1;
      if (has(a, "shrug", "yes")) sc.trunk += 2;
      if (has(a, "acc", "never")) sc.trunk += 1;

      const main = sc.acj > sc.rc ? "acj" : "rc";
      const other = main === "rc" ? "acj" : "rc";
      const patterns = [main];
      if (sc[other] >= 3) patterns.push(other);
      if (sc.btn >= 3) patterns.push("btn");
      if (sc.trunk >= 2) patterns.push("trunk");

      const picks = [];
      if (has(a, "style", "behind")) picks.push(["front", 1]);
      picks.push(["load", main === "acj" ? 2 : 6]);
      if (has(a, "acc", "never") || has(a, "acc", "sometimes") || has(a, "shrug", "yes")) picks.push(["acc", 3]);
      if (has(a, "arch", "yes") || has(a, "arch", "unsure")) picks.push(["brace", 4]);
      if (has(a, "wall", "barely") || has(a, "wall", "no")) picks.push(["tspine", 5]);
      if (has(a, "ogrip", "wide")) picks.push(["grip", 4.5]);
      return finish(a, sc, patterns, picks, false);
    },

  ["관절막 충돌", "관절낭 충돌"],

];
const GLOSS_RE = new RegExp("(" + GLOSS.map(g => g[0]).sort((a, b) => b.length - a.length)
  .map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")(으로|이에요|예요|이|가|을|를|은|는|과|와|로)?", "g");
const GLOSS_MAP = Object.fromEntries(GLOSS);
function josa(word, j) {
  const core = word.replace(/\([^)]*\)$/, "").trim();
  const c = core.charCodeAt(core.length - 1) - 0xAC00;
  const hangul = c >= 0 && c < 11172, jong = hangul ? c % 28 : 0, b = jong !== 0, r = jong === 8;
  return { "이": b ? "이" : "가", "가": b ? "이" : "가", "을": b ? "을" : "를", "를": b ? "을" : "를",
    "은": b ? "은" : "는", "는": b ? "은" : "는", "과": b ? "과" : "와", "와": b ? "과" : "와",
    "으로": b && !r ? "으로" : "로", "로": b && !r ? "으로" : "로", "이에요": b ? "이에요" : "예요", "예요": b ? "이에요" : "예요" }[j];
}
const toPro = text => text.replace(GLOSS_RE, (m, t, j) => { const w = GLOSS_MAP[t]; return w + (j ? josa(w, j) : ""); });
function applyLevel(root) {
  if (S.level !== "pro") return;
  const walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; while (walk.nextNode()) nodes.push(walk.currentNode);
  nodes.forEach(n => { if (n.parentElement && n.parentElement.closest("[data-raw]")) return; const t = toPro(n.nodeValue); if (t !== n.nodeValue) n.nodeValue = t; });
  root.querySelectorAll("textarea").forEach(el => { el.value = toPro(el.value); });
}

function elbowFigure(sel) {
  const sh = { L: [130, 62], R: [190, 62] }, len = 70;
  const angles = { tucked: 45, mid: 70, flared: 90 };
  const arm = (deg, side, cls) => {
    const r = deg * Math.PI / 180, s = side === "R" ? 1 : -1;
    const [x, y] = sh[side];
    const ex = x + s * len * Math.sin(r), ey = y + len * Math.cos(r);
    const on = cls === "on";
    return `<line x1="${x}" y1="${y}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="${on ? "var(--plate)" : "var(--muted)"}" stroke-width="${on ? 10 : 1.5}" stroke-linecap="round" ${on ? "" : "stroke-dasharray=\"4 4\""}/>` +
      (on ? `<circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="7" fill="var(--ink)"/>` : "");
  };
  const lab = { 90: [272, 66], 70: [266, 96], 45: [248, 128] };
  const label = deg => `<text x="${lab[deg][0]}" y="${lab[deg][1]}" style="${angles[sel] === deg ? "fill:var(--plate);font-weight:600" : ""}">${deg}°</text>`;
  return `<svg class="bar-fig" viewBox="0 0 320 186" role="img" aria-label="벤치에 누운 모습을 위에서 본 팔꿈치 각도 비교">

    ${[45, 70, 90].filter(d => d !== angles[sel]).map(d => arm(d, "L") + arm(d, "R")).join("")}
    ${sel ? arm(angles[sel], "L", "on") + arm(angles[sel], "R", "on") : ""}
    ${label(90)}${label(70)}${label(45)}
  </svg>`;
}

function arcFigure(sel) {

  const hot = k => sel === k || sel === "all";
  const armDeg = sel === "top" ? 165 : sel === "mid" ? 90 : sel === "all" ? 120 : 90;

    <line x1="${cx}" y1="${cy}" x2="${ax.toFixed(1)}" y2="${ay.toFixed(1)}" stroke="var(--ink)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="5" fill="var(--ink)"/>

}

    const msg = !last ? "다음 운동 후에 기록해 주세요." :
      last.v === "less" ? `${last.d}: 덜 아팠어요. 이 조정이 나에게 맞는 단서예요.` :
      last.v === "same" ? `${last.d}: 같았어요. 다른 조정과 함께 2주는 지켜보세요.` :
      `${last.d}: 더 아팠어요. 이 조정은 멈추고, 계속 아프면 전문가에게 확인받으세요.`;
    return `<div class="adj">
      <div class="head"><h3>${esc(d.title)}</h3>${chip(d.ev)}</div>
      ${basis("app", d.how)}
      ${basis("fact", d.fact, d.src)}
      ${basis("hypo", d.hypo)}
      ${rvb(S.topic + ".adj." + id)}
      <div class="log">
        <div class="seg" role="group" aria-label="${esc(d.title)} 효과 기록">
          <button data-act="log" data-id="${id}" data-v="less" aria-pressed="${last && last.d === today && last.v === "less"}">덜 아팠어요</button>
          <button data-act="log" data-id="${id}" data-v="same" aria-pressed="${last && last.d === today && last.v === "same"}">같았어요</button>
          <button data-act="log" data-id="${id}" data-v="more" aria-pressed="${last && last.d === today && last.v === "more"}">더 아팠어요</button>
        </div>
        <p class="logmsg">${esc(msg)}</p>
      </div>
    </div>`;
  }).join("");

  const refer = r.referFirst ? `<div class="notice" style="background:var(--warn-tint)">
      <h3>이 경우엔 진료를 먼저 권해요</h3>
      <p>${[r.referWrist && "손목 옆쪽이나 손바닥 쪽이 아프고", r.referElbow && "팔꿈치 앞쪽이 아프고", r.referKnee && "무릎이 붓거나 안·바깥쪽이 아프고", r.referNerve && "통증이나 저림이 무릎 아래로 내려가고", r.referDaily && "운동하지 않을 때도 아프고", r.referLong && "6주 넘게 계속되고", r.referWorse && "점점 나빠지고"].filter(Boolean).join(", ")} 있어요. 아래 조정은 참고만 하고, 정형외과나 재활의학과에서 먼저 확인받으세요.</p>
    </div>` : "";

  return `<section class="screen stack-lg">
    <div class="stack">
      <p class="eyebrow">3단계 · 패턴 안내</p>
      <h2>이런 답을 한 분들에게 흔한 패턴이에요</h2>
      <p class="lead">진단이 아니라, 어디서 무엇을 바꿔볼지 정하기 위한 안내예요.</p>
    </div>
    <div class="card legend">
      <h3>이 결과를 읽는 법</h3>
      <p class="src">모든 내용에 아래 네 가지 중 하나를 붙였어요. 근거의 출처와 한계를 함께 보여드리기 위해서예요.</p>
      <ul class="kinds">
        <li>${tag("fact")}<span>논문 본문에서 직접 확인한 결과</span></li>
        <li>${tag("synth")}<span>여러 연구를 종합해서 내린 해석</span></li>
        <li>${tag("app")}<span>연구를 바탕으로 앱이 권하는 실용적인 방법</span></li>
        <li>${tag("hypo")}<span>앱이 세운 것으로, 아직 연구로 확인되지 않은 부분</span></li>
      </ul>
      <p class="src"><span class="rv">전문가 검토 완료</span> 표시가 붙은 항목은 전문가 검토를 마친 것이에요. 답변으로 패턴과 조정을 고르는 규칙 등 나머지는 아직 검토 전이에요.</p>
    </div>
    ${refer}
    ${pats}
    ${T.extras(r).join("")}

    ${adj ? `<div class="stack">
      <p class="eyebrow">4단계 · 바로 해볼 조정</p>
      <h2>다음 운동에서 이것부터 바꿔 보세요</h2>
      <p class="lead">운동이 끝나면 각 조정 아래에 기록하세요. 덜 아프게 만든 조정이 나에게 맞는 단서예요.</p>
    </div>
    <div class="card">${adj}</div>` : `<div class="stack">
      <p class="eyebrow">4단계 · 바로 해볼 조정</p>
      <h2>이 경우엔 운동 조정보다 진료가 먼저예요</h2>
      <p class="lead">아래 "전문가에게 확인받을 때 보기"에서 어디로 가면 되는지 확인하세요.</p>
    </div>`}

    <div class="row">
      <button class="btn" data-act="expert">전문가에게 확인받을 때 보기</button>
    </div>
    <div class="row">
      <button class="btn ghost small" data-act="editAnswers">답 고치기</button>
      <button class="btn ghost small" data-act="restart">처음부터 다시</button>
    </div>

    <div class="card">
      <h3>근거 자료</h3>
      <ul class="sources">${SOURCES.map(([t, u]) => `<li><a href="${u}" target="_blank" rel="noopener">${esc(t)}</a></li>`).join("")}</ul>
    </div>
  </section>`;
}

function summaryText(r) {
  const lines = [`[${T.brand} 결과 요약]`, ...T.summary(S.a), `앱이 본 패턴: ${r.patterns.map(p => PATTERNS[p].name).join(", ")}`];
  const logged = Object.keys(ADJUSTMENTS).filter(k => (LOG[logId(k)] || []).length);
  if (logged.length) {
    lines.push("조정 기록:");
    logged.forEach(k => { const arr = LOG[logId(k)]; const l = arr[arr.length - 1]; lines.push(`- ${ADJUSTMENTS[k].title}: ${{ less: "덜 아팠음", same: "같았음", more: "더 아팠음" }[l.v]} (${l.d})`); });
  }
  return lines.join("\n");
}

function viewExpert() {
  const r = analyse(S.a);
  const rows = [
    ["조정을 2주 해도 그대로이거나 나빠짐", "정형외과·재활의학과", "원인 확인과 재활 계획이 필요해요", r.referWorse],
    ["운동 안 할 때도 아프거나 6주 넘게 지속", "정형외과·재활의학과", "오래된 통증은 진료가 먼저예요", r.referDaily || r.referLong || r.referNerve || r.referKnee || r.referElbow || r.referWrist],
    ["통증은 줄었는데 자세가 불안함", "트레이너", "폼 교정과 프로그램 조정", false],
  ];
  return `<section class="screen stack-lg">
    <div class="stack">
      <p class="eyebrow">5단계 · 전문가 연결</p>
      <h2>이럴 땐 전문가에게 확인받으세요</h2>
      <p class="lead">2주는 다 나을 때까지 기다리는 기간이 아니라, 한 번 확인받을 시점이에요. 물리치료 운동 프로그램은 보통 12주 정도 걸려요.</p>
      ${rvb("all.expert")}
      ${basis("hypo", "\"2주\"는 앱이 정한 확인 시점이에요. 영국 1차 진료 요약은 운동치료로 좋아지는 데 6~12주를 보고, 그때도 나아지지 않으면 의뢰하라고 해요.")}
    </div>
    <div class="card tablewrap">
      <table>
        <thead><tr><th>상황</th><th>찾아갈 곳</th><th>이유</th></tr></thead>
        <tbody>${rows.map(([a, b, c, hit]) => `<tr class="${hit ? "hit" : ""}"><td>${esc(a)}${hit ? "<br><span class=\"src\" style=\"color:var(--plate)\">내 답변에 해당</span>" : ""}</td><td>${esc(b)}</td><td>${esc(c)}</td></tr>`).join("")}</tbody>
      </table>
    </div>
    <div class="card">
      <h3>전문가에게 보여줄 요약</h3>
      <p class="src">진료나 상담 때 이 내용을 보여주면 설명 시간이 줄어요.</p>
      <pre class="summary" id="summary">${esc(summaryText(r))}</pre>
      <div class="row"><button class="btn small" data-act="copy">요약 복사</button></div>
      <p class="logmsg" id="copymsg"></p>
    </div>
    <div class="notice">
      <h3>병원·트레이너 연결은 준비 중이에요</h3>
      <p>나중에는 이 요약을 들고 가까운 전문가와 바로 연결할 수 있게 만들 예정이에요.</p>
    </div>
    <div class="row">
      <button class="btn ghost" data-act="toResult">결과로 돌아가기</button>
      <button class="btn ghost" data-act="restart">처음부터 다시</button>
    </div>
  </section>`;
}

function render() {
  renderStages();
  document.getElementById("brandName").textContent = T ? T.brand : "운동 통증 점검";
  document.getElementById("brandTag").textContent = T ? T.eyebrow : "PAIN CHECK";
  const v = { start: viewStart, flags: viewFlags, flagged: viewFlagged, q: viewQuestion, result: viewResult, expert: viewExpert }[S.screen];
  document.getElementById("main").innerHTML = v();
  document.querySelectorAll('[data-act="level"]').forEach(el => el.setAttribute("aria-pressed", String(el.dataset.v === S.level)));
  applyLevel(document.getElementById("main"));
}
function go(screen) { S.screen = screen; render(); window.scrollTo(0, 0); }

/* =========================================================
   ACTIONS
   ========================================================= */
const ACT = {
  level(d) { S.level = d.v === "pro" ? "pro" : "easy"; try { localStorage.setItem("painLevel", S.level); } catch (e) { /* 저장 불가 */ } render(); },
  part(d) { if (S.part !== d.v) { S.part = d.v; S.exi = null; S.area = null; S.topic = null; T = null; } render(); },
  exer(d) { const ex = BODY.find(b => b.id === S.part).ex[+d.v]; S.exi = +d.v; S.area = null;
    if (ex.at.length === 1) pickArea(ex.at[0], 0); else { S.topic = null; T = null; render(); } },
  area(d) { const ex = BODY.find(b => b.id === S.part).ex[S.exi]; pickArea(ex.at[+d.v], +d.v); },
  start() { go("flags"); },
  home() { go("start"); },
  sample() { S.agreed = true; S.flags = Object.fromEntries(RED_FLAGS.map(f => [f.id, false])); S.a = JSON.parse(JSON.stringify(T.sample)); S.qi = QUESTIONS.length - 1; go("result"); },
  flag(d) { S.flags[d.id] = d.v === "1"; const y = window.scrollY; render(); window.scrollTo(0, y); },
  flagsNext() { go(RED_FLAGS.some(f => S.flags[f.id]) ? "flagged" : "q"); },
  backFlags() { go("flags"); },
  choose(d) {
    const q = QUESTIONS[S.qi];
    if (q.multi) {
      let cur = Array.isArray(S.a[q.id]) ? S.a[q.id].slice() : [];
      if (d.v === "none") cur = cur.includes("none") ? [] : ["none"];
      else { cur = cur.filter(x => x !== "none"); cur = cur.includes(d.v) ? cur.filter(x => x !== d.v) : cur.concat(d.v); }
      S.a[q.id] = cur;
    } else S.a[q.id] = d.v;
    render();
  },
  prev() { if (S.qi === 0) go("flags"); else { S.qi--; go("q"); } },
  next() { if (S.qi < QUESTIONS.length - 1) { S.qi++; go("q"); } else go("result"); },
  log(d) {
    const today = new Date().toISOString().slice(0, 10);
    const key = logId(d.id);
    const arr = (LOG[key] || []).filter(e => e.d !== today);
    arr.push({ d: today, v: d.v });
    LOG[key] = arr; saveLog(LOG);
    const y = window.scrollY; render(); window.scrollTo(0, y);
  },
  expert() { go("expert"); },
  toResult() { go("result"); },
  editAnswers() { S.qi = 0; go("q"); },
  restart() { S.flags = {}; S.a = Object.assign({}, S.pre || {}); S.qi = 0; go("start"); },
  copy() {
    const el = document.getElementById("summary"), msg = document.getElementById("copymsg");
    const done = () => { msg.textContent = "복사했어요."; };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.textContent = "복사가 막혀 있어요. 선택된 글을 길게 눌러 복사해 주세요."; };
    try { navigator.clipboard.writeText(el.textContent).then(done, fallback); } catch (e) { fallback(); }
  },
};

document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  if (!t || t.disabled) return;
  ACT[t.dataset.act](t.dataset);
});
document.addEventListener("change", e => {
  if (e.target.id === "agree") { S.agreed = e.target.checked; render(); document.getElementById("agree").focus(); }
});

render();
</script>
